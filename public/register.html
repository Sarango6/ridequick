<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - RideRent</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
    <div class="auth-card">
        <div class="logo">Ride<span>Rent</span></div>
        <h1>Create account</h1>
        <p class="muted">Create one account to list vehicles and rent vehicles from other users.</p>
        <form id="registerForm" novalidate>
            <input id="name" name="name" type="text" placeholder="Full name" required>
            <input id="email" name="email" type="email" placeholder="Email" required>
            <input id="phone" name="phone" type="tel" placeholder="Phone number" required>
            <input id="licenseNumber" name="licenseNumber" type="text" placeholder="Driving license number" required>
            <input id="password" name="password" type="password" placeholder="Password" required>
            <input id="confirmPassword" name="confirmPassword" type="password" placeholder="Confirm password" required>
            <label class="terms-checkbox">
            <input id="termsAccepted" name="termsAccepted" type="checkbox" required>
                <span>
                    I agree to the <a href="#" target="_blank">Terms & Conditions</a>
                    and Privacy Policy.
                </span>
            </label>
            <button class="btn btn-primary full" type="submit">Create Account</button>
            <p id="registerMessage" class="form-message"></p>
        </form>
        <p class="auth-footer">Already have an account? <a href="login.html">Login</a></p>
    </div>
    <script src="js/common.js"></script>
    <script src="js/register.js"></script>
</body>
</html>
